<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты - СтройКом</title>
    <meta name="description" content="Контактная информация строительной компании СтройКом. Адрес, телефон, email. Форма для заказа сметы.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">...</header>
    <main>
        <section class="page-header section">
            <div class="container">
                <h1>Контакты</h1>
            </div>
        </section>

        <section class="contact section">
            <div class="container">
                <div class="contact-section__grid"> <!-- используем тот же класс, что на главной -->
                    <div class="contact-info">
                        <h2>Реквизиты</h2>
                        <p>ООО «СтройКом»</p>
                        <p>ИНН 1234567890, КПП 123456789</p>
                        <p>Адрес: 123456, г. Москва, ул. Строителей, д. 1</p>
                        <p>Телефон: <a href="tel:+74951234567">+7 (495) 123-45-67</a></p>
                        <p>Email: <a href="mailto:info@stroykom.ru">info@stroykom.ru</a></p>
                        <h3>Режим работы</h3>
                        <p>Пн-Пт: 09:00–18:00</p>
                        <p>Сб-Вс: выходной</p>
                    </div>

                    <div class="contact-form" id="estimate-form">
                        <h2>Запросить смету</h2>
                        <form class="form" action="#" method="POST" netlify>
                            <input type="hidden" name="form-name" value="estimate">
                            <div class="form__group">
                                <label for="name">Ваше имя *</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            <div class="form__group">
                                <label for="phone">Телефон *</label>
                                <input type="tel" id="phone" name="phone" required pattern="[0-9+\-\s]+" title="Введите телефон в формате +7 XXX XXX-XX-XX">
                            </div>
                            <div class="form__group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email">
                            </div>
                            <div class="form__group">
                                <label for="message">Описание задачи *</label>
                                <textarea id="message" name="message" rows="5" required></textarea>
                            </div>
                            <div class="form__group form__group--checkbox">
                                <input type="checkbox" id="consent" name="consent" required>
                                <label for="consent">Я согласен на обработку персональных данных</label>
                            </div>
                            <button type="submit" class="btn btn--primary">Отправить заявку</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <section class="map section">
            <div class="container">
                <h2>Как нас найти</h2>
                <iframe src="https://yandex.ru/map-widget/v1/?ll=37.617698%2C55.755864&z=12" width="100%" height="400" style="border:0;" allowfullscreen loading="lazy"></iframe>
            </div>
        </section>
    </main>
    <footer class="footer">...</footer>
</body>
</html>
